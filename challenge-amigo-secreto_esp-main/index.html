<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Amigo Secreto</title>
</head>

<body>
    <!-- Escritorio Windows XP -->
    <div class="xp-desktop">

        <!-- Ventana principal -->
        <div class="xp-window" id="mainWindow">

            <!-- Barra de título -->
            <div class="xp-titlebar">
                <span class="xp-titlebar-icon">🎁</span>
                <span class="xp-titlebar-title">Amigo Secreto</span>
                <div class="xp-window-controls">
                    <button class="xp-btn xp-btn-minimize" title="Minimizar">&#x2014;</button>
                    <button class="xp-btn xp-btn-maximize" title="Maximizar">&#x25A1;</button>
                    <button class="xp-btn xp-btn-close" title="Cerrar" id="btnClose">&#x2715;</button>
                </div>
            </div>

            <!-- Contenido -->
            <div class="xp-content">

                <!-- Sección de entrada -->
                <div class="xp-section">
                    <label for="amigo" class="xp-label">Nombre del participante:</label>
                    <div class="xp-input-row">
                        <input
                            type="text"
                            id="amigo"
                            class="xp-input"
                            placeholder="Escribe un nombre..."
                            maxlength="50"
                            autocomplete="off"
                        >
                        <button class="xp-button" id="btnAgregar">Añadir</button>
                    </div>
                </div>

                <!-- Lista de participantes -->
                <fieldset class="xp-fieldset">
                    <legend class="xp-legend">
                        Participantes &nbsp;<span class="xp-badge" id="contador">0</span>
                    </legend>
                    <ul id="listaAmigos" class="xp-list"></ul>
                    <p class="xp-empty-hint" id="emptyHint">Aún no hay participantes. ¡Agrega nombres!</p>
                </fieldset>

                <!-- Resultado del sorteo -->
                <div class="xp-result-box" id="resultBox" style="display:none;">
                    <div class="xp-result-inner">
                        <span class="xp-result-icon">🎉</span>
                        <span class="xp-result-text" id="resultadoTexto"></span>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="xp-button-row">
                    <button class="xp-button xp-button-primary" id="btnSortear">
                        <img src="assets/play_circle_outline.png" alt="" width="14" height="14">
                        Sortear amigo
                    </button>
                    <button class="xp-button" id="btnReset">Reiniciar</button>
                </div>

            </div><!-- /xp-content -->

            <!-- Barra de estado -->
            <div class="xp-statusbar">
                <div class="xp-status-panel" id="statusMsg">Listo. Agrega participantes para comenzar.</div>
                <div class="xp-status-panel xp-status-right" id="statusCount">0 participantes</div>
            </div>

        </div><!-- /xp-window -->

    </div><!-- /xp-desktop -->

    <script src="app.js" defer></script>
</body>
</html>
